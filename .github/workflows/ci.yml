name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for Node tests
        run: |
          # The repository postinstall targets Electron's native ABI. CI runs
          # the test suite under Node, so install without lifecycle scripts and
          # build better-sqlite3 exactly once for the active Node runtime.
          npm ci --ignore-scripts
          npm rebuild better-sqlite3

      # `npm test` verifies that the native binding matches the active Node ABI.
      - name: Test
        run: npm test

      # The skill packages ship node:test suites that need the agent sandbox's
      # document libraries (pinned in skills/package.json to the sandbox
      # stdlib versions). Vitest excludes them; they run here instead.
      - name: Skill package tests (node:test)
        run: |
          npm ci --prefix skills --no-audit --no-fund
          npm run test:skills

      # Order-of-magnitude regression gate for the storage and streaming hot
      # paths fixed in the perf review. The ceilings are 20x-300x above the
      # measured numbers, so this catches a reverted fix, not runner noise.
      # Linux only: the Windows job is a focused filesystem gate, and timings
      # from a second OS would add flake without adding signal.
      - name: Performance regression benchmarks
        run: RUN_BENCH=1 npx vitest run tests/perf/review-bench.test.ts tests/perf/markdown-stream.test.ts --reporter=verbose

      # Verbose output surfaces the independently asserted final ledger totals:
      # 6 fixed, 3 declaredByProfile, 0 pending.
      - name: Lifecycle conformance, closed ledger, and architecture fences
        run: npm run test:lifecycle -- --reporter=verbose

      # Typechecking is also the capability-profile completeness gate: adding
      # a capability fails until every profile declares a boolean position.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Runs the Node-level suite and the Electron build on darwin. The suite has
  # no darwin-gated tests of the app's Electron runtime paths (window
  # lifecycle, packaged-app PATH, Podman wizard), so this doesn't cover those;
  # it covers the darwin branches unit tests do reach (case-insensitive FS in
  # tracked-paths/adf-database, the darwin user-data path, host-exec 'macos',
  # real-shell login PATH tests, POSIX-only tests) and proves electron-vite
  # builds on macOS. Typecheck and lint are platform-independent, so they stay
  # on the Linux job.
  #
  # Keep the install/test/lifecycle/build steps in sync with `verify` above
  # (a matrix can't share them: job-level `if:` can't reference matrix values).
  verify-macos:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for Node tests
        run: |
          # Same as the Linux job: skip the Electron-ABI postinstall and build
          # better-sqlite3 once for the active Node runtime.
          npm ci --ignore-scripts
          npm rebuild better-sqlite3

      - name: Test
        run: npm test

      # Run even when Test fails: they are independent signals, and a failing
      # unit test shouldn't hide whether lifecycle conformance or the build
      # hold on macOS.
      - name: Lifecycle conformance, closed ledger, and architecture fences
        if: ${{ !cancelled() }}
        run: npm run test:lifecycle -- --reporter=verbose

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
