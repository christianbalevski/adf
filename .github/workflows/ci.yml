name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # These checks do not require a native database or an Electron runtime.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '^22.23.4'
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --ignore-scripts

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Anti-pattern ratchet
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:ratchet

      - name: CLI reference is up to date
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run docs:cli -- --check

      # Route coverage runs in the full Node suite. Validate the spec and
      # generated reference here, independently of the runtime tests.
      - name: API contract and reference are up to date
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run docs:api:lint
          npm run docs:api
          git diff --exit-code -- docs/daemon/api-reference.md docs/daemon/api-reference.html

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '^22.23.4'
          cache: npm

      - name: Install dependencies for Node tests
        id: install
        run: |
          # The postinstall targets Electron. The full suite runs under Node.
          npm ci --ignore-scripts
          npm rebuild better-sqlite3

      # Includes lifecycle conformance, route coverage, and the ADF format
      # contract. The dedicated parity job runs tests/parity under Electron.
      - name: Test
        env:
          PARITY_EXCLUDE: '1'
        run: npm test

      # Vitest excludes these node:test suites, which use the skill packages'
      # document libraries pinned to the agent sandbox versions.
      - name: Skill package tests (node:test)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm ci --prefix skills --no-audit --no-fund
          npm run test:skills

      # Run timing-sensitive workloads serially on one OS.
      - name: Storage, streaming, daemon context, and TUI regression benchmarks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run bench:review -- --maxWorkers=1
          npm run bench:daemon-context
          npm run bench:tui

      - name: Studio rendering regression benchmarks (Chromium)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node node_modules/electron/install.js
          xvfb-run -a npm run bench:studio -- --no-sandbox

  # Exercise Darwin-specific paths and launch the unsigned packaged app for
  # cold start, login-shell PATH, window recreation, and clean quit.
  verify-macos:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '^22.23.4'
          cache: npm

      - name: Install dependencies for Node tests
        id: install
        run: |
          npm ci --ignore-scripts
          npm rebuild better-sqlite3

      - name: Test
        env:
          PARITY_EXCLUDE: '1'
        run: npm test

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # The Electron runtime paths the unit suite can't reach: launch the
      # packaged app and drive its main process (cold start, login-shell PATH,
      # window recreation after the last window closes, clean quit). See
      # scripts/electron-smoke.mjs. Unsigned host-arch --dir build: no dmg,
      # no notarization. Packaging rebuilds better-sqlite3 for Electron, so
      # these stay last.
      - name: Package the app (unsigned)
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dir --publish never -c.mac.identity=null -c.mac.notarize=false

      - name: Electron smoke (packaged app)
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: npm run test:electron-smoke

  # Build on each target OS and compare the embedded runtime with the bundled
  # daemon running under Electron-as-Node, as it does in packaged Studio.
  # Both sides load better-sqlite3 under Electron's Node runtime. The harness
  # uses a test keychain. The release workflow explains the Windows runner pin.
  daemon-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '^22.23.4'
          cache: npm

      # @electron/get's download cache (about 100 MB per OS), keyed on the lockfile.
      - name: Cache the Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/.cache/electron
            ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies with the Electron binary
        shell: bash
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js

      - name: Electron runs as Node
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) ELECTRON=node_modules/electron/dist/electron.exe ;;
            macOS) ELECTRON=node_modules/electron/dist/Electron.app/Contents/MacOS/Electron ;;
            *) ELECTRON=node_modules/electron/dist/electron ;;
          esac
          echo "ELECTRON=$ELECTRON" >> "$GITHUB_ENV"
          ELECTRON_RUN_AS_NODE=1 "$ELECTRON" -e "require('better-sqlite3')(':memory:').close(); console.log('electron', process.versions.electron, 'node', process.version, 'better-sqlite3 ok')"

      # electron-vite build: out/main/index.js and the daemon, out/main/daemon.js.
      - name: Build
        run: npm run build

      # The Gmail and Google Calendar MCP servers Studio ships: bundled, then run
      # on this OS's Electron binary in Node mode (the other test jobs have no
      # Electron).
      - name: Bundled MCP server on Electron-as-Node
        run: npx vitest run tests/unit/services/bundled-mcp-servers-smoke.test.ts --reporter=verbose

      - name: Parity, daemon side required
        shell: bash
        env:
          PARITY_REQUIRE_DAEMON: '1'
          # Windows runners scan every file write in real time.
          PARITY_SLICE_BOUND_MS: '600'
          PARITY_DAEMON_LOG_DIR: ${{ runner.temp }}/parity-daemon-logs
        run: ELECTRON_RUN_AS_NODE=1 "$ELECTRON" node_modules/vitest/vitest.mjs run tests/parity --reporter=verbose --testTimeout=240000 --hookTimeout=120000

      - name: Daemon logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-daemon-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/parity-daemon-logs
          if-no-files-found: ignore
