name: Windows Node and filesystem validation

# CI currently exercises tests/typecheck/lint/build only on Ubuntu. The release
# workflow uses windows-2022 for packaging, but does not execute the collision
# or SQLite sidecar behavior. Keep this behavioral gate separate so the runner's
# native Windows semantics are explicit and reusable for future changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-validation.yml'
      - 'src/main/adf/adf-database.ts'
      - 'src/main/adf/adf-workspace.ts'
      - 'src/main/adf/agent-template-files.ts'
      - 'src/main/adf/agent-templates.ts'
      - 'src/main/utils/user-data-path.ts'
      - 'src/main/ipc/file-create-*.ts'
      - 'src/renderer/hooks/useAdfFile.ts'
      - 'src/renderer/utils/file-operation-errors.ts'
      - 'src/shared/types/ipc.types.ts'
      - 'tests/unit/adf-database-create-collision.test.ts'
      - 'tests/unit/adf-database-wal-cleanup.test.ts'
      - 'tests/unit/ipc/file-create-handler.test.ts'
      - 'tests/unit/ipc/file-create-recovery.test.ts'
      - 'tests/unit/renderer/file-operation-errors.test.ts'
      - 'tests/unit/tools/sys-create-adf-collision.test.ts'
      - 'tests/unit/agent-templates-instantiate.test.ts'
      - 'tests/daemon-node-runtime.test.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  windows-2022:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Match CI's Node-test setup rather than Electron postinstall. The test
      # process runs under Node 22, so rebuild better-sqlite3 for that ABI.
      - name: Install Node-test dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          $ciExit = $LASTEXITCODE
          if ($ciExit -ne 0) { throw "npm ci --ignore-scripts failed with exit code $ciExit" }
          npm rebuild better-sqlite3
          $rebuildExit = $LASTEXITCODE
          if ($rebuildExit -ne 0) { throw "npm rebuild better-sqlite3 failed with exit code $rebuildExit" }

      # These tests create, copy and reopen real SQLite files. They finish in
      # well under a second locally but take 5-12s on this runner (file I/O under
      # real-time scanning), so the 5s vitest default fails them; and a test that
      # times out is still holding its database open when cleanup runs, which
      # is where the follow-on EBUSY came from.
      - name: Focused collision and lifecycle tests
        shell: pwsh
        run: >-
          npx vitest run
          tests/unit/adf-database-create-collision.test.ts
          tests/unit/adf-database-wal-cleanup.test.ts
          tests/unit/ipc/file-create-handler.test.ts
          tests/unit/ipc/file-create-recovery.test.ts
          tests/unit/renderer/file-operation-errors.test.ts
          tests/unit/tools/sys-create-adf-collision.test.ts
          tests/unit/agent-templates-instantiate.test.ts
          tests/daemon-node-runtime.test.ts
          --testTimeout=60000
          --hookTimeout=60000
          --reporter=verbose

      # Deliberately NOT the full suite: a handful of tests assume POSIX paths,
      # modes, and unlink-while-open, and fail on Windows on main too. Typecheck,
      # lint, and build are platform-independent and stay in the Ubuntu CI.
