title = "ADF gitleaks config"

# Default gitleaks rules, minus known false positives in this repo.
[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures use fake keys and tokens"
paths = ['''^tests/''']

[[allowlists]]
description = "Truncated example DIDs in docs (did:key:z6MkAliceOwner...)"
regexTarget = "line"
regexes = ['''did:key:z6Mk[A-Za-z0-9]*\.\.\.''']

[[allowlists]]
description = "Key variable names in code, not key values"
regexTarget = "line"
regexes = ['''\bprivateKeyPkcs8\b''']
